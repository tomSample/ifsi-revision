<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFSI Révisions 2025 - Chargement...</title>
    <meta http-equiv="refresh" content="0; url=./src/frontend/pages/index.html">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        // Redirection immédiate vers la vraie page d'accueil
        window.location.href = './src/frontend/pages/index.html';
    </script>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Chargement de l'application IFSI...</p>
        <p><small>Si la page ne charge pas, <a href="./src/frontend/pages/index.html" style="color: white; text-decoration: underline;">cliquez ici</a></small></p>
    </div>
</body>
</html>
