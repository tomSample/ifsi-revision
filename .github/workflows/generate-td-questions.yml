name: Generate static study data

on:
  push:
    branches:
      - main
      - to_v3
      - 'feature/**'
    paths:
      - 'src/data/UE-2.8/UE 2.8 - processus obstructifs.xlsx'
      - 'src/data/UE-2.6/UE 2.6 - processus psychopathologiques.xlsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate static questionnaires
        run: python scripts/generate-td-questions.py

      - name: Generate UE 2.6 recap data
        run: python scripts/generate-ue26-json.py

      - name: Commit generated data
        run: |
          if git diff --quiet -- src/data/UE-2.8/td-questions.json src/data/UE-2.6/psychopathologie.normalized.json; then
            echo "Generated data is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/UE-2.8/td-questions.json
          git add src/data/UE-2.6/psychopathologie.normalized.json
          git commit -m "chore: regenerate static study data"
          git push
