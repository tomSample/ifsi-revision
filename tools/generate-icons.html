<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Générateur d'icônes PWA</title>
</head>
<body>
    <canvas id="canvas192" width="192" height="192"></canvas>
    <canvas id="canvas512" width="512" height="512"></canvas>
    <br>
    <button onclick="downloadIcons()">Télécharger les icônes</button>
    
    <script>
        // Fonction pour créer une icône
        function createIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            
            // Fond dégradé violet
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Texte IFSI
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.25}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('IFSI', size / 2, size / 2);
            
            // Sous-titre
            ctx.font = `${size * 0.1}px Arial`;
            ctx.fillText('Révisions', size / 2, size / 2 + size * 0.2);
        }
        
        // Créer les deux icônes
        createIcon(document.getElementById('canvas192'), 192);
        createIcon(document.getElementById('canvas512'), 512);
        
        // Fonction de téléchargement
        function downloadIcons() {
            // Icône 192x192
            const canvas192 = document.getElementById('canvas192');
            const link192 = document.createElement('a');
            link192.download = 'icon-192.png';
            link192.href = canvas192.toDataURL('image/png');
            link192.click();
            
            // Icône 512x512
            setTimeout(() => {
                const canvas512 = document.getElementById('canvas512');
                const link512 = document.createElement('a');
                link512.download = 'icon-512.png';
                link512.href = canvas512.toDataURL('image/png');
                link512.click();
            }, 500);
            
            alert('✅ Icônes générées! Placez-les dans le dossier /images/');
        }
        
        // Télécharger automatiquement au chargement
        window.addEventListener('load', () => {
            setTimeout(() => {
                downloadIcons();
            }, 1000);
        });
    </script>
</body>
</html>
