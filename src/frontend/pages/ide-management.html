<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFSI Lannion 2025 - Prises en Charge IDE</title>
    <link rel="manifest" href="../../../public/manifest.json">
    <meta name="theme-color" content="#667eea">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 2rem;
        }

        .header p {
            color: #7f8c8d;
        }

        .back-btn {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 12px;
            color: #666;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Charts Container */
        .charts-container {
            display: grid;
            gap: 2rem;
        }

        .chart-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chart-title {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .table-wrapper {
            overflow-x: auto;
            padding: 1rem;
        }

        /* === TABLE STYLING === */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        thead {
            background: #f8f9fa;
            border-bottom: 2px solid #e0e0e0;
        }

        th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: #2c3e50;
            white-space: nowrap;
            word-wrap: break-word;
            max-width: 300px;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid #e9ecef;
            color: #555;
            vertical-align: top;
            word-wrap: break-word;
            max-width: 300px;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        /* First column - row headers */
        td:first-child,
        th:first-child {
            font-weight: 600;
            background: #f8f9fa;
            color: #2c3e50;
            max-width: 150px;
            white-space: normal;
            word-break: break-word;
        }

        tbody tr:hover td:first-child {
            background: #e8ecf0;
        }

        /* Content formatting */
        td ul, td ol {
            margin: 0.5rem 0 0.5rem 1.5rem;
            padding: 0;
        }

        td li {
            margin: 0.3rem 0;
            color: #555;
        }

        /* Line breaks in content */
        .cell-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* Empty State */
        .empty-state {
            padding: 3rem;
            text-align: center;
            color: #999;
            background: white;
            border-radius: 12px;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        /* Footer */
        .footer {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            margin-top: 2rem;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .table-wrapper {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            th, td {
                padding: 0.75rem 0.5rem;
                font-size: 0.85rem;
                max-width: 150px;
            }

            table {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>🏥 Prises en Charge IDE</h1>
                <p>Tableaux récapitulatifs par Unité d'Enseignement</p>
            </div>
            <a href="./home.html" class="back-btn">← Retour à l'accueil</a>
        </div>

        <!-- Charts Container -->
        <div class="charts-container" id="chartsContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>Chargement des tableaux...</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>Plateforme de révision IFSI Lannion 2025 | Prises en charge IDE</p>
        </div>
    </div>

    <script>
        /**
         * Parser CSV simple avec support du contenu multi-ligne
         */
        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            const data = [];
            
            for (let i = 0; i < lines.length; i++) {
                // Gérer les guillemets pour les cellules multi-lignes
                let line = lines[i];
                let row = [];
                let current = '';
                let insideQuotes = false;

                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    const nextChar = line[j + 1];

                    if (char === '"' && nextChar === '"') {
                        current += '"';
                        j++; // Skip next quote
                    } else if (char === '"') {
                        insideQuotes = !insideQuotes;
                    } else if (char === ',' && !insideQuotes) {
                        row.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                row.push(current.trim());
                data.push(row);
            }
            
            return data;
        }

        /**
         * Charger et afficher tous les fichiers CSV de role_ide_charts
         */
        async function loadAndDisplayCharts() {
            try {
                const container = document.getElementById('chartsContainer');
                container.innerHTML = ''; // Vider le loading

                // Liste des fichiers CSV à charger (à adapter selon les fichiers disponibles)
                const csvFiles = [
                    'UE 2.4.S1 - Traumatismes.csv'
                    // Ajouter d'autres fichiers ici à mesure que vous les uploadez
                    // 'UE X.X.SX - Titre.csv',
                    // 'UE Y.Y.SY - Titre.csv',
                ];

                let chartsLoaded = 0;

                for (const filename of csvFiles) {
                    try {
                        const response = await fetch(`../../../src/data/role_ide_charts/${encodeURIComponent(filename)}`);
                        
                        if (!response.ok) {
                            console.warn(`Fichier non trouvé: ${filename}`);
                            continue;
                        }

                        const csvText = await response.text();
                        const rows = parseCSV(csvText);

                        if (rows.length === 0) {
                            console.warn(`Fichier vide: ${filename}`);
                            continue;
                        }

                        // Créer la carte du tableau
                        const card = document.createElement('div');
                        card.className = 'chart-card';

                        // Extraire le titre du nom de fichier (sans .csv)
                        const title = filename.replace('.csv', '');
                        
                        card.innerHTML = `
                            <div class="chart-title">${title}</div>
                            <div class="table-wrapper">
                                ${createTableHTML(rows)}
                            </div>
                        `;

                        container.appendChild(card);
                        chartsLoaded++;

                    } catch (error) {
                        console.error(`Erreur chargement ${filename}:`, error);
                    }
                }

                // Si aucun fichier chargé
                if (chartsLoaded === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <h3>Aucun tableau disponible</h3>
                            <p>Veuillez uploader les fichiers CSV dans src/data/role_ide_charts/</p>
                        </div>
                    `;
                }

            } catch (error) {
                console.error('Erreur chargement tableaux:', error);
                document.getElementById('chartsContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <h3>Erreur de chargement</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        /**
         * Créer le HTML du tableau à partir des données CSV
         */
        function createTableHTML(rows) {
            if (rows.length < 2) {
                return '<p>Données insuffisantes pour afficher le tableau</p>';
            }

            const headers = rows[0];
            const bodyRows = rows.slice(1);

            let html = '<table><thead><tr>';
            
            // Créer les en-têtes
            headers.forEach((header, idx) => {
                html += `<th>${escapeHTML(header)}</th>`;
            });
            html += '</tr></thead><tbody>';

            // Créer les lignes du tableau
            bodyRows.forEach(row => {
                html += '<tr>';
                row.forEach((cell, idx) => {
                    // Formater le contenu (gérer les sauts de ligne)
                    const content = formatCellContent(cell);
                    html += `<td><div class="cell-content">${content}</div></td>`;
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            return html;
        }

        /**
         * Formater le contenu d'une cellule
         */
        function formatCellContent(text) {
            if (!text) return '';
            
            // Échapper les caractères HTML
            let content = escapeHTML(text);
            
            // Convertir les sauts de ligne en <br>
            content = content.replace(/\n/g, '<br>');
            
            // Convertir les listes (lignes commençant par -) en ul/li
            if (content.includes('- ')) {
                const lines = content.split('<br>');
                const listItems = [];
                const otherLines = [];

                lines.forEach(line => {
                    const trimmed = line.trim();
                    if (trimmed.startsWith('- ')) {
                        listItems.push(trimmed.substring(2));
                    } else if (trimmed) {
                        otherLines.push(line);
                    }
                });

                if (listItems.length > 0) {
                    let html = '';
                    if (otherLines.length > 0) {
                        html += otherLines.join('<br>') + '<br>';
                    }
                    html += '<ul>' + listItems.map(item => `<li>${item}</li>`).join('') + '</ul>';
                    return html;
                }
            }

            return content;
        }

        /**
         * Échapper les caractères HTML
         */
        function escapeHTML(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Charger les tableaux au démarrage
        document.addEventListener('DOMContentLoaded', loadAndDisplayCharts);
    </script>
</body>
</html>
