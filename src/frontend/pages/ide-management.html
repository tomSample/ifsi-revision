<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFSI Lannion 2025 - Prises en Charge IDE</title>
    <link rel="manifest" href="../../../public/manifest.json">
    <meta name="theme-color" content="#667eea">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 2rem;
        }

        .header p {
            color: #7f8c8d;
            flex: 1;
        }

        .back-btn {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        /* ÉCRAN DE PORTAIL (UEs) */
        .portal-screen {
            display: none;
        }

        .portal-screen.active {
            display: block;
        }

        .ue-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .ue-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            border: 2px solid transparent;
        }

        .ue-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }

        .ue-card h3 {
            color: #2c3e50;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .ue-card p {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .ue-card .count {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* ÉCRAN DE LISTE TABLEAUX */
        .list-screen {
            display: none;
        }

        .list-screen.active {
            display: block;
        }

        .breadcrumb {
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            color: #7f8c8d;
            font-size: 0.95rem;
        }

        .breadcrumb a {
            color: #667eea;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .charts-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .chart-item {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            text-align: center;
        }

        .chart-item:hover {
            transform: translateY(-6px);
            border-color: #667eea;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.2);
        }

        .chart-item-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .chart-item h3 {
            color: #2c3e50;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .chart-item p {
            color: #7f8c8d;
            font-size: 0.85rem;
        }

        /* ÉCRAN DE VISUALISATION */
        .view-screen {
            display: none;
        }

        .view-screen.active {
            display: block;
        }

        .view-header {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .view-header h2 {
            color: #2c3e50;
            flex: 1;
        }

        .view-buttons {
            display: flex;
            gap: 1rem;
        }

        .nav-btn {
            padding: 0.75rem 1.5rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: #764ba2;
        }

        .nav-btn.secondary {
            background: #e0e0e0;
            color: #333;
        }

        .nav-btn.secondary:hover {
            background: #d0d0d0;
        }

        /* Charts Container */
        .charts-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        #tableContainer {
            width: 100%;
            overflow-x: auto;
            max-height: calc(100vh - 300px);
            overflow-y: auto;
        }

        .chart-title {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
            font-size: 1.3rem;
            font-weight: 600;
        }

        /* === DATATABLES CUSTOMIZATION === */
        .dataTables_wrapper {
            width: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        .dataTables_scroll {
            width: 100% !important;
        }

        .dataTables_scrollBody {
            width: 100% !important;
        }

        #dataTable {
            width: 100% !important;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin: 0 !important;
        }

        #dataTable thead {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            position: sticky;
            top: 0;
            z-index: 100;
            border: none;
        }

        #dataTable thead th {
            color: white !important;
            font-weight: 700 !important;
            padding: 1rem 0.75rem !important;
            border-right: 1px solid rgba(255, 255, 255, 0.3) !important;
            text-align: left !important;
            font-size: 0.85rem !important;
            line-height: 1.4 !important;
            white-space: normal !important;
            word-break: break-word !important;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%) !important;
            border: none !important;
            border-bottom: none !important;
        }

        #dataTable tbody {
            border-top: none !important;
        }

        /* Masquer la ligne de dimensionnement de DataTables */
        .dataTables_sizing {
            display: none !important;
        }

        #dataTable tbody td {
            padding: 0.875rem 0.75rem !important;
            vertical-align: top;
            white-space: normal;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 0.8rem !important;
            color: #2c3e50;
            border-bottom: 1px solid #e8eef5 !important;
            border-right: 1px solid #f0f0f0 !important;
        }

        #dataTable tbody tr:hover td {
            background-color: rgba(102, 126, 234, 0.08) !important;
        }

        #dataTable tbody tr:nth-child(odd) td {
            background-color: #ffffff !important;
        }

        #dataTable tbody tr:nth-child(even) td {
            background-color: #f8f9fc !important;
        }

        /* Barre de recherche */
        .dataTables_filter {
            text-align: left;
            padding: 1rem 0.75rem !important;
        }

        .dataTables_filter input {
            padding: 0.5rem 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.9rem;
            width: 300px;
        }

        .dataTables_filter input:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
        }

        .dataTables_filter label {
            color: #2c3e50;
            font-weight: 500;
        }

        /* Liste + UL dans les cellules */
        #dataTable ul,
        #dataTable ol {
            margin: 0.3rem 0 !important;
            padding-left: 1.2rem !important;
        }

        #dataTable li {
            margin: 0.2rem 0 !important;
            color: #2c3e50 !important;
            line-height: 1.3 !important;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 12px;
            color: #666;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            padding: 3rem;
            text-align: center;
            color: #999;
            background: white;
            border-radius: 12px;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .footer {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            margin-top: 2rem;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .ue-grid, .charts-list {
                grid-template-columns: 1fr;
            }

            .view-header {
                flex-direction: column;
                gap: 1rem;
            }

            th, td {
                padding: 0.75rem 0.5rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>🏥 Prises en Charge IDE</h1>
                <p>Tableaux récapitulatifs par Unité d'Enseignement</p>
            </div>
            <a href="./home.html" class="back-btn">← Accueil</a>
        </div>

        <!-- ÉCRAN 1: PORTAIL UE -->
        <div class="portal-screen active" id="portalScreen">
            <div class="ue-grid" id="ueGrid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Chargement des UE disponibles...</p>
                </div>
            </div>
        </div>

        <!-- ÉCRAN 2: LISTE DES TABLEAUX -->
        <div class="list-screen" id="listScreen">
            <div class="breadcrumb">
                <a onclick="backToPortal()">📚 Portail</a>
                <span>›</span>
                <span id="selectedUEName"></span>
            </div>
            <div class="charts-list" id="chartsList">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Chargement des tableaux...</p>
                </div>
            </div>
        </div>

        <!-- ÉCRAN 3: VISUALISATION TABLEAU -->
        <div class="view-screen" id="viewScreen">
            <div class="view-header">
                <div>
                    <h2 id="viewTitle"></h2>
                </div>
                <div class="view-buttons">
                    <button class="nav-btn" onclick="exportTableToCSV()">📥 Exporter CSV</button>
                    <button class="nav-btn secondary" onclick="backToList()">← Retour à la liste</button>
                </div>
            </div>
            <div class="charts-container">
                <div id="tableContainer" style="width: 100%;"></div>
            </div>
            <div class="footer">
                <p>📊 Scrollez horizontalement pour voir toutes les colonnes</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>Plateforme de révision IFSI Lannion 2025 | Prises en charge IDE</p>
        </div>
    </div>

    <script>
        // État global
        let allCharts = [];
        let selectedUE = null;
        let selectedChart = null;

        /**
         * Parser CSV robuste
         */
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentCell = '';
            let insideQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                const nextChar = csvText[i + 1];

                if (char === '"') {
                    if (insideQuotes && nextChar === '"') {
                        currentCell += '"';
                        i += 2;
                    } else {
                        insideQuotes = !insideQuotes;
                        i++;
                    }
                } else if (char === ',' && !insideQuotes) {
                    currentRow.push(currentCell.trim());
                    currentCell = '';
                    i++;
                } else if ((char === '\n' || char === '\r') && !insideQuotes) {
                    if (currentCell.trim() || currentRow.length > 0) {
                        currentRow.push(currentCell.trim());
                        if (currentRow.some(cell => cell)) {
                            rows.push(currentRow);
                        }
                        currentRow = [];
                        currentCell = '';
                    }
                    if (char === '\r' && nextChar === '\n') {
                        i += 2;
                    } else {
                        i++;
                    }
                } else {
                    currentCell += char;
                    i++;
                }
            }

            if (currentCell.trim() || currentRow.length > 0) {
                currentRow.push(currentCell.trim());
                if (currentRow.some(cell => cell)) {
                    rows.push(currentRow);
                }
            }

            return rows;
        }

        /**
         * Extraire l'UE du nom de fichier
         * Ex: "UE 2.4.S1 - Traumatismes.csv" => "UE 2.4.S1"
         */
        function extractUE(filename) {
            const match = filename.match(/^([^-]*)/);
            return match ? match[1].trim() : filename;
        }

        /**
         * Extraire le nom du tableau du nom de fichier
         * Ex: "UE 2.4.S1 - Traumatismes.csv" => "Traumatismes"
         */
        function extractChartName(filename) {
            const match = filename.match(/\s*-\s*(.+?)\.(csv|txt)$/i);
            return match ? match[1].trim() : filename;
        }

        /**
         * Charger tous les fichiers CSV disponibles
         * Charge depuis deux sources: role_ide_charts et recap_charts
         */
        async function loadAllCharts() {
            try {
                allCharts = [];

                // SOURCE 1: role_ide_charts (tableaux de prises en charge IDE)
                const roleIdeCharts = [
                    'UE 2.4.S1 - Traumatismes.csv'
                    // Ajouter d'autres fichiers ici
                ];
                
                for (const filename of roleIdeCharts) {
                    await loadChartFromSource(`../../../src/data/role_ide_charts/${encodeURIComponent(filename)}`, filename);
                }

                // SOURCE 2: recap_charts (tableaux récapitulatifs - ex: familles de médicaments)
                // Structure: fichiers CSV nommés par UE dans recap_charts
                const recapCharts = [
                    { ue: 'UE 4.4.S1 - Familles de médicaments', file: '' },
                    { ue: 'UE 2.5.S2 - Infections cutanées', file: '' },
                    { ue: 'UE 2.5.S2 - Infections respiratoires basses', file: '' },
                    { ue: 'UE 2.5.S2 - Maladies éruptives pédiatriques', file: '' }
                ];
                
                for (const chart of recapCharts) {
                    const filename = chart.ue;
                    const path = `../../../src/data/recap_charts/${encodeURIComponent(chart.ue)}.csv`;
                    await loadChartFromSource(path, filename);
                }

                // Afficher le portail
                displayPortal();

            } catch (error) {
                console.error('Erreur chargement tableaux:', error);
                document.getElementById('ueGrid').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <h3>Erreur de chargement</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        /**
         * Charger un fichier CSV depuis un chemin donné
         */
        async function loadChartFromSource(path, filename) {
            try {
                const response = await fetch(path);
                
                if (!response.ok) {
                    console.warn(`Fichier non trouvé: ${filename}`);
                    return;
                }

                const csvText = await response.text();
                const rows = parseCSV(csvText);

                if (rows.length > 0) {
                    allCharts.push({
                        filename,
                        ue: extractUE(filename),
                        name: extractChartName(filename),
                        rows
                    });
                    console.log(`✓ Tableau chargé: ${filename}`);
                }

            } catch (error) {
                console.error(`Erreur chargement ${filename}:`, error);
            }
        }

        /**
         * Afficher le portail des UE avec filtrage par semestre
         */
        function displayPortal() {
            const currentSemester = SemesterSelector.getSemester();
            
            // Filtrer les tableaux par semestre actif
            const filteredCharts = allCharts.filter(chart => {
                const ue = chart.ue;
                return ue.includes(currentSemester);
            });
            
            const uees = [...new Set(filteredCharts.map(c => c.ue))].sort();
            const grid = document.getElementById('ueGrid');

            if (uees.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>Aucun tableau disponible pour ${currentSemester}</h3>
                        <p>Veuillez uploader les fichiers CSV dans src/data/recap_charts/ ou role_ide_charts/</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = uees.map(ue => {
                const count = filteredCharts.filter(c => c.ue === ue).length;
                return `
                    <div class="ue-card" onclick="selectUE('${ue}')">
                        <h3>${ue}</h3>
                        <div class="count">${count} fiche(s)${count > 1 ? 'x' : ''}</div>
                    </div>
                `;
            }).join('');
        }

        /**
         * Sélectionner une UE et afficher ses tableaux
         */
        function selectUE(ue) {
            selectedUE = ue;
            document.getElementById('selectedUEName').textContent = ue;

            const chartsForUE = allCharts.filter(c => c.ue === ue);
            const list = document.getElementById('chartsList');

            if (chartsForUE.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>Aucun tableau pour cette UE</h3>
                    </div>
                `;
            } else {
                list.innerHTML = chartsForUE.map((chart, idx) => `
                    <div class="chart-item" onclick="selectChart(${idx})">
                        <div class="chart-item-icon">📊</div>
                        <h3>${chart.name}</h3>
                    </div>
                `).join('');
            }

            // Changer d'écran
            document.getElementById('portalScreen').classList.remove('active');
            document.getElementById('listScreen').classList.add('active');
        }

        /**
         * Sélectionner un tableau et l'afficher
         */
        function selectChart(chartIndex) {
            const chartsForUE = allCharts.filter(c => c.ue === selectedUE);
            selectedChart = chartsForUE[chartIndex];

            document.getElementById('viewTitle').textContent = `${selectedChart.ue} - ${selectedChart.name}`;
            
            // Initialiser DataTables avec les données du CSV
            initDataTable(selectedChart.rows);

            // Changer d'écran
            document.getElementById('listScreen').classList.remove('active');
            document.getElementById('viewScreen').classList.add('active');
        }

        /**
         * Initialiser DataTables avec les données CSV
         */
        function initDataTable(rows) {
            if (rows.length < 2) {
                document.getElementById('tableContainer').innerHTML = '<p>Données insuffisantes</p>';
                return;
            }

            const headers = rows[0];
            const dataRows = rows.slice(1);

            // Construire le HTML du tableau
            let tableHtml = '<table id="dataTable" class="display" style="width:100%"><thead><tr>';
            headers.forEach(header => {
                tableHtml += `<th>${escapeHTML(header)}</th>`;
            });
            tableHtml += '</tr></thead><tbody>';

            dataRows.forEach(row => {
                tableHtml += '<tr>';
                row.forEach(cell => {
                    tableHtml += `<td>${formatCellContent(cell || '')}</td>`;
                });
                tableHtml += '</tr>';
            });

            tableHtml += '</tbody></table>';

            // Remplacer le contenu
            document.getElementById('tableContainer').innerHTML = tableHtml;

            // Détruire DataTable précédent s'il existe
            if (window.dataTableInstance) {
                window.dataTableInstance.destroy();
            }

            // Initialiser DataTables avec configuration optimisée pour la lecture
            window.dataTableInstance = $('#dataTable').DataTable({
                paging: false,                  // Pas de pagination
                ordering: false,                // Pas de tri
                searching: true,                // Barre de recherche
                info: false,                    // Pas d'infos (showing x to y)
                autoWidth: false,               // Pas d'auto width
                colReorder: false,              // Pas de réorganisation des colonnes
                columnDefs: [{
                    targets: '_all',
                    className: 'text-wrap'
                }],
                language: {
                    search: 'Rechercher:',
                    zeroRecords: 'Aucun résultat trouvé',
                    emptyTable: 'Aucune donnée disponible'
                }
            });
        }

        /**
         * Retourner au portail
         */
        function backToPortal() {
            selectedUE = null;
            selectedChart = null;
            document.getElementById('portalScreen').classList.add('active');
            document.getElementById('listScreen').classList.remove('active');
            document.getElementById('viewScreen').classList.remove('active');
        }

        /**
         * Retourner à la liste des tableaux
         */
        function backToList() {
            document.getElementById('viewScreen').classList.remove('active');
            document.getElementById('listScreen').classList.add('active');
        }

        /**
         * Formater le contenu d'une cellule (HTML sûr + listes)
         */
        function formatCellContent(text) {
            if (!text) return '';
            
            let content = escapeHTML(text);
            const lines = content.split('\n').map(line => line.trim());
            
            let html = '';
            let inList = false;
            let listItems = [];

            lines.forEach(line => {
                if (line.startsWith('- ')) {
                    if (!inList) {
                        inList = true;
                        listItems = [];
                    }
                    listItems.push(line.substring(2));
                } else if (line) {
                    if (inList) {
                        html += '<ul>' + listItems.map(item => `<li>${item}</li>`).join('') + '</ul>';
                        inList = false;
                        listItems = [];
                    }
                    html += line + '<br>';
                }
            });

            if (inList && listItems.length > 0) {
                html += '<ul>' + listItems.map(item => `<li>${item}</li>`).join('') + '</ul>';
            }

            html = html.replace(/<br>$/g, '').trim();
            return html;
        }

        /**
         * Échapper les caractères HTML
         */
        function escapeHTML(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        /**
         * Exporter le tableau en CSV
         */
        function exportTableToCSV() {
            if (!window.dataTableInstance) {
                alert('Aucun tableau à exporter');
                return;
            }
            
            // Récupérer les données du tableau
            const table = window.dataTableInstance;
            const headers = [];
            const rows = [];

            // Récupérer les en-têtes
            table.columns().header().toArray().forEach(th => {
                headers.push(th.textContent);
            });

            // Récupérer les données filtrées
            table.rows({ search: 'applied' }).data().toArray().forEach(row => {
                rows.push(row);
            });

            // Convertir en CSV
            let csv = headers.map(h => `"${h.replace(/"/g, '""')}"`).join(',') + '\n';
            rows.forEach(row => {
                const rowData = Object.values(row).map(cell => {
                    if (cell && typeof cell === 'string') {
                        return `"${cell.replace(/"/g, '""').replace(/<[^>]*>/g, '')}"`;
                    }
                    return `"${cell || ''}"`;
                }).join(',');
                csv += rowData + '\n';
            });

            // Télécharger le fichier
            const fileName = document.getElementById('viewTitle').textContent.replace(/[^a-z0-9]/gi, '_').toLowerCase() + '_' + new Date().toISOString().split('T')[0];
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.setAttribute('href', URL.createObjectURL(blob));
            link.setAttribute('download', fileName + '.csv');
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Callback pour le changement de semestre
        function onSemesterChanged(semester) {
            console.log(`📚 Changement vers ${semester}`);
            displayPortal();
        }

        // Charger au démarrage
        document.addEventListener('DOMContentLoaded', function() {
            // Initialiser le sélecteur de semestre avec le callback
            setTimeout(() => {
                SemesterSelector.init(onSemesterChanged);
            }, 100);
            
            // Charger les tableaux
            loadAllCharts();
        });
    </script>

    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    
    <!-- Sélecteur de semestre -->
    <script src="../assets/scripts/semester-selector.js"></script>
