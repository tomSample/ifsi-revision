<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFSI Lannion 2025 - Prises en Charge IDE</title>
    <link rel="manifest" href="../../../public/manifest.json">
    
    <!-- Design System CSS -->
    <link rel="stylesheet" href="../assets/styles/theme.css">
    <link rel="stylesheet" href="../assets/styles/design-system.css">
    <link rel="stylesheet" href="../assets/styles/animations.css">
    <link rel="stylesheet" href="../assets/styles/layout.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-ide-primary: #DC2626;
            --color-ide-secondary: #7C2D12;
        }

        body {
            font-family: var(--font-family-base);
            background: var(--color-bg-light);
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        .app-header {
            background: var(--color-bg);
            border-bottom: 1px solid var(--color-border);
            padding: var(--space-4);
            box-shadow: var(--shadow-xs);
            position: sticky;
            top: 0;
            z-index: 40;
        }

        .header-content {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-4);
            flex-wrap: wrap;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .header-brand h1 {
            font-size: var(--font-size-xl);
            color: var(--color-text-dark);
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: var(--space-3);
            align-items: center;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: var(--space-1);
            padding: var(--space-2) var(--space-3);
            background: var(--color-bg-lighter);
            border-radius: var(--radius-full);
            text-decoration: none;
            color: var(--color-text-dark);
            font-weight: 600;
            transition: all var(--transition-normal);
            border: 1px solid var(--color-border);
        }

        .back-link:hover {
            background: var(--color-primary);
            color: white;
        }

        /* ===== MAIN CONTAINER ===== */
        .main-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: var(--space-4);
        }

        /* ===== UE SELECTOR ===== */
        .ue-selector {
            background: var(--color-bg);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            margin-bottom: var(--space-6);
            box-shadow: var(--shadow-xs);
            border: 1px solid var(--color-border);
        }

        .ue-selector-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-3);
        }

        .ue-selector-header h2 {
            font-size: var(--font-size-lg);
            color: var(--color-text-dark);
        }

        .ue-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: var(--space-3);
        }

        .ue-card {
            padding: var(--space-3);
            background: var(--color-bg-lighter);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-normal);
            text-align: center;
        }

        .ue-card:hover {
            border-color: var(--color-primary);
            background: var(--color-bg);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .ue-card.active {
            border-color: var(--color-primary);
            background: rgba(37, 99, 235, 0.08);
        }

        .ue-card-title {
            font-weight: 700;
            color: var(--color-text-dark);
            margin-bottom: var(--space-2);
        }

        .ue-card-count {
            font-size: var(--font-size-xs);
            color: var(--color-text-muted);
            background: var(--color-bg-lighter);
            padding: var(--space-1) var(--space-2);
            border-radius: var(--radius-full);
            display: inline-block;
        }

        /* ===== PATHOLOGY VIEW ===== */
        .pathology-view {
            background: var(--color-bg);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--color-border);
        }

        .pathology-header {
            background: linear-gradient(135deg, var(--color-ide-primary) 0%, var(--color-ide-secondary) 100%);
            color: white;
            padding: var(--space-4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-3);
            flex-wrap: wrap;
        }

        .pathology-title-section {
            flex: 1;
        }

        .pathology-ue {
            font-size: var(--font-size-sm);
            opacity: 0.9;
            margin-bottom: var(--space-1);
        }

        .pathology-name {
            font-size: var(--font-size-xl);
            font-weight: 700;
        }

        .pathology-actions {
            display: flex;
            gap: var(--space-2);
        }

        .action-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--radius-full);
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .action-btn.active {
            background: white;
            color: var(--color-ide-primary);
        }

        /* ===== TABS ===== */
        .tabs-container {
            display: flex;
            overflow-x: auto;
            border-bottom: 1px solid var(--color-border);
            padding: var(--space-2);
            gap: var(--space-2);
        }

        .tab-btn {
            padding: var(--space-2) var(--space-3);
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--color-text-muted);
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all var(--transition-normal);
            font-size: var(--font-size-sm);
        }

        .tab-btn:hover {
            color: var(--color-text-dark);
        }

        .tab-btn.active {
            color: var(--color-ide-primary);
            border-bottom-color: var(--color-ide-primary);
        }

        /* ===== CONTENT ===== */
        .pathology-content {
            padding: var(--space-4);
            max-height: calc(100vh - 300px);
            overflow-y: auto;
        }

        .accordion-item {
            margin-bottom: var(--space-3);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: all var(--transition-normal);
        }

        .accordion-item.expanded {
            box-shadow: var(--shadow-sm);
        }

        .accordion-header {
            padding: var(--space-3);
            background: var(--color-bg-lighter);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: all var(--transition-fast);
        }

        .accordion-header:hover {
            background: var(--color-bg-light);
        }

        .accordion-header-title {
            font-weight: 600;
            color: var(--color-text-dark);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .accordion-icon {
            transition: transform var(--transition-normal);
            color: var(--color-primary);
            font-size: 1.2rem;
        }

        .accordion-item.expanded .accordion-icon {
            transform: rotate(180deg);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height var(--transition-normal);
            background: white;
        }

        .accordion-item.expanded .accordion-content {
            max-height: 1000px;
        }

        .accordion-body {
            padding: var(--space-3);
            line-height: 1.6;
            color: var(--color-text-dark);
        }

        .accordion-body ul,
        .accordion-body ol {
            margin: var(--space-2) 0 var(--space-2) var(--space-4);
            padding-left: var(--space-3);
        }

        .accordion-body li {
            margin: var(--space-1) 0;
        }

        .field-row {
            margin-bottom: var(--space-3);
        }

        .field-label {
            font-weight: 700;
            color: var(--color-ide-primary);
            margin-bottom: var(--space-1);
            font-size: var(--font-size-sm);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .field-value {
            color: var(--color-text-dark);
            line-height: 1.6;
            word-break: break-word;
        }

        /* ===== FILTERS ===== */
        .filters-section {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--space-3);
            margin-bottom: var(--space-4);
        }

        .filter-row {
            display: flex;
            gap: var(--space-2);
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: var(--space-2) var(--space-3);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            transition: border-color var(--transition-fast);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .filter-btn {
            padding: var(--space-2) var(--space-3);
            background: var(--color-bg-lighter);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            transition: all var(--transition-normal);
        }

        .filter-btn:hover {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        .filter-btn.active {
            background: var(--color-primary);
            color: white;
        }

        /* ===== FAVORITES ===== */
        .favorite-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            transition: transform var(--transition-fast);
        }

        .favorite-btn:hover {
            transform: scale(1.2);
        }

        .favorite-btn.favorited {
            color: var(--color-ide-primary);
        }

        /* ===== COMPARISON ===== */
        .comparison-mode {
            background: var(--color-bg-lighter);
            padding: var(--space-3);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-3);
            border-left: 4px solid var(--color-primary);
        }

        .comparison-mode-label {
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: var(--space-2);
        }

        .selected-items {
            display: flex;
            gap: var(--space-2);
            flex-wrap: wrap;
        }

        .selected-item {
            background: var(--color-primary);
            color: white;
            padding: var(--space-1) var(--space-2);
            border-radius: var(--radius-full);
            font-size: var(--font-size-sm);
            display: flex;
            align-items: center;
            gap: var(--space-1);
        }

        .selected-item-remove {
            cursor: pointer;
            font-weight: bold;
        }

        /* ===== HISTORY ===== */
        .history-list {
            display: flex;
            gap: var(--space-2);
            flex-wrap: wrap;
        }

        .history-item {
            background: var(--color-bg-lighter);
            padding: var(--space-2) var(--space-3);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-normal);
            border: 1px solid var(--color-border);
            font-size: var(--font-size-sm);
        }

        .history-item:hover {
            border-color: var(--color-primary);
            background: rgba(37, 99, 235, 0.05);
        }

        /* ===== EXPORT ===== */
        .export-btn {
            display: inline-flex;
            align-items: center;
            gap: var(--space-1);
            padding: var(--space-2) var(--space-3);
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            transition: all var(--transition-normal);
        }

        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .ue-grid {
                grid-template-columns: 1fr;
            }

            .pathology-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .filter-row {
                flex-direction: column;
            }

            .search-box {
                min-width: 100%;
            }

            .tabs-container {
                padding: var(--space-1);
            }

            .tab-btn {
                padding: var(--space-1) var(--space-2);
                font-size: var(--font-size-xs);
            }

            .pathology-content {
                max-height: none;
                overflow-y: visible;
            }
        }

        /* ===== LOADING STATE ===== */
        .loading {
            text-align: center;
            padding: var(--space-8);
            color: var(--color-text-muted);
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--color-bg-lighter);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: var(--space-3);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: var(--space-8);
            color: var(--color-text-muted);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: var(--space-2);
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="app-header">
        <div class="header-content">
            <div class="header-brand">
                <h1>🏥 Prises en Charge IDE</h1>
            </div>
            <div class="header-actions">
                <a href="./home.html" class="back-link">← Retour à l'accueil</a>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-container">
        <!-- UE SELECTOR -->
        <div class="ue-selector" id="ueSelector">
            <div class="ue-selector-header">
                <h2>📚 Sélectionnez une Unité d'Enseignement</h2>
                <button class="export-btn" onclick="exportAllToJSON()">📥 Exporter tout</button>
            </div>
            <div class="ue-grid" id="ueGrid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Chargement des UE...</p>
                </div>
            </div>
        </div>

        <!-- PATHOLOGY VIEW -->
        <div id="pathologyView" style="display: none;">
            <!-- FILTERS -->
            <div class="filters-section">
                <div class="filter-row">
                    <div class="search-box">
                        <input type="text" id="searchBox" placeholder="🔍 Rechercher une pathologie..." onkeyup="filterPathologies()">
                    </div>
                    <button class="filter-btn" onclick="toggleFavoritesOnly()" id="favoritesToggle">⭐ Favoris</button>
                    <button class="filter-btn" onclick="toggleComparisonMode()" id="comparisonToggle">⚖️ Comparer</button>
                </div>
                
                <!-- COMPARISON MODE -->
                <div id="comparisonMode" style="display: none; margin-top: var(--space-3);">
                    <div class="comparison-mode">
                        <div class="comparison-mode-label">Mode comparaison activé</div>
                        <div class="selected-items" id="selectedItems"></div>
                        <button class="export-btn" style="margin-top: var(--space-2);" onclick="exportComparison()">📊 Exporter comparaison</button>
                    </div>
                </div>

                <!-- HISTORY -->
                <div style="margin-top: var(--space-3); display: none;" id="historySection">
                    <div style="font-weight: 600; margin-bottom: var(--space-2); color: var(--color-text-muted); font-size: var(--font-size-sm);">📜 Dernièrement consultées:</div>
                    <div class="history-list" id="historyList"></div>
                </div>
            </div>

            <!-- PATHOLOGY CONTENT -->
            <div class="pathology-view">
                <div class="pathology-header">
                    <div class="pathology-title-section">
                        <div class="pathology-ue" id="currentUE"></div>
                        <div class="pathology-name" id="currentPathology"></div>
                    </div>
                    <div class="pathology-actions">
                        <button class="action-btn favorite-btn" id="favBtn" onclick="toggleFavorite()" title="Ajouter aux favoris">⭐</button>
                        <button class="action-btn" onclick="toggleComparisonSelect()" id="compareBtn" title="Ajouter à la comparaison" style="display: none;">✓</button>
                        <button class="action-btn" onclick="downloadPathology()" title="Télécharger">⬇️</button>
                    </div>
                </div>

                <!-- TABS -->
                <div class="tabs-container" id="tabsContainer"></div>

                <!-- CONTENT -->
                <div class="pathology-content" id="pathologyContent"></div>
            </div>
        </div>
    </div>

    <script>
        // ===== GLOBAL STATE =====
        let allCharts = [];
        let selectedUE = null;
        let selectedPathology = null;
        let favorites = JSON.parse(localStorage.getItem('ide_favorites') || '[]');
        let history = JSON.parse(localStorage.getItem('ide_history') || '[]');
        let comparisonMode = false;
        let selectedForComparison = [];
        let showFavoritesOnly = false;

        // ===== PARSE CSV =====
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentCell = '';
            let insideQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                const nextChar = csvText[i + 1];

                if (char === '"') {
                    if (insideQuotes && nextChar === '"') {
                        currentCell += '"';
                        i += 2;
                    } else {
                        insideQuotes = !insideQuotes;
                        i++;
                    }
                } else if (char === ',' && !insideQuotes) {
                    currentRow.push(currentCell.trim());
                    currentCell = '';
                    i++;
                } else if ((char === '\n' || char === '\r') && !insideQuotes) {
                    if (currentCell.trim() || currentRow.length > 0) {
                        currentRow.push(currentCell.trim());
                        if (currentRow.some(cell => cell)) {
                            rows.push(currentRow);
                        }
                        currentRow = [];
                        currentCell = '';
                    }
                    if (char === '\r' && nextChar === '\n') {
                        i += 2;
                    } else {
                        i++;
                    }
                } else {
                    currentCell += char;
                    i++;
                }
            }

            if (currentCell.trim() || currentRow.length > 0) {
                currentRow.push(currentCell.trim());
                if (currentRow.some(cell => cell)) {
                    rows.push(currentRow);
                }
            }

            return rows;
        }

        // ===== LOAD CHARTS =====
        async function loadAllCharts() {
            try {
                const response = await fetch('../../data/charts-list.json');
                if (!response.ok) throw new Error('Erreur chargement JSON');

                const data = await response.json();
                if (!data.success || !data.charts) throw new Error('Données invalides');

                for (const chart of data.charts) {
                    const path = `../../data/${chart.path.split('data/')[1]}`;
                    const filename = chart.ue;
                    await loadChartFromSource(path, filename);
                }

                displayPortal();
            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('ueGrid').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        async function loadChartFromSource(path, filename) {
            try {
                const response = await fetch(path);
                if (!response.ok) return;

                const csvText = await response.text();
                const rows = parseCSV(csvText);

                if (rows.length > 0) {
                    const ue = filename.match(/^([^-]*)/)?.[1].trim() || filename;
                    allCharts.push({
                        filename,
                        ue,
                        name: filename.match(/\s*-\s*(.+?)\.(csv|txt)$/i)?.[1]?.trim() || filename,
                        rows
                    });
                }
            } catch (error) {
                console.error(`Erreur ${filename}:`, error);
            }
        }

        // ===== DISPLAY PORTAL =====
        function displayPortal() {
            const currentSemester = SemesterSelector?.getSemester?.() || 'S1';
            const filteredCharts = allCharts.filter(c => c.ue.includes(currentSemester));
            const uees = [...new Set(filteredCharts.map(c => c.ue))].sort();

            const grid = document.getElementById('ueGrid');
            if (uees.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>Aucun tableau disponible</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = uees.map(ue => {
                const count = filteredCharts.filter(c => c.ue === ue).length;
                return `
                    <div class="ue-card" onclick="selectUE('${ue.replace(/'/g, "\\'")}')">
                        <div class="ue-card-title">${ue}</div>
                        <div class="ue-card-count">${count} fiche(s)</div>
                    </div>
                `;
            }).join('');
        }

        // ===== SELECT UE =====
        function selectUE(ue) {
            selectedUE = ue;
            document.getElementById('ueSelector').style.display = 'none';
            document.getElementById('pathologyView').style.display = 'block';
            document.getElementById('currentUE').textContent = ue;

            const chartsForUE = allCharts.filter(c => c.ue === ue);
            displayPathologies(chartsForUE);
        }

        // ===== DISPLAY PATHOLOGIES =====
        function displayPathologies(charts) {
            const grid = document.getElementById('ueGrid');
            grid.innerHTML = '';

            charts.forEach((chart, idx) => {
                const headers = chart.rows[0] || [];
                const data = Object.fromEntries(headers.map((h, i) => [h, chart.rows[1]?.[i] || '']));

                const card = document.createElement('div');
                card.className = 'ue-card';
                card.onclick = () => selectPathology(chart, idx);
                card.innerHTML = `
                    <div class="ue-card-title">${chart.name}</div>
                    <div style="font-size: var(--font-size-xs); color: var(--color-text-muted); margin-top: var(--space-1);">
                        ${data['Définition'] ? data['Définition'].substring(0, 50) + '...' : ''}
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('ueSelector').style.display = 'block';
            document.getElementById('ueSelector').querySelector('.ue-selector-header h2').textContent = `📋 ${selectedUE}`;
        }

        // ===== SELECT PATHOLOGY =====
        function selectPathology(chart, idx) {
            selectedPathology = chart;
            addToHistory(chart.name);
            document.getElementById('currentPathology').textContent = chart.name;

            const headers = chart.rows[0] || [];
            const data = chart.rows[1] || [];

            // Create tabs
            const tabsContainer = document.getElementById('tabsContainer');
            tabsContainer.innerHTML = '';

            const categories = ['Définition', 'Physiopathologie', 'Signes cliniques', 'Symptômes', 'Examens spécifiques', 'Signes biologiques', 'Traitements', 'Surveillances IDE', 'Complications', 'Mesures préventives'];

            categories.forEach((category, i) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${i === 0 ? 'active' : ''}`;
                btn.textContent = category;
                btn.onclick = () => selectTab(category);
                tabsContainer.appendChild(btn);
            });

            // Create content
            const contentDiv = document.getElementById('pathologyContent');
            contentDiv.innerHTML = '';

            headers.forEach((header, i) => {
                if (data[i]) {
                    const item = document.createElement('div');
                    item.className = 'accordion-item expanded';
                    item.innerHTML = `
                        <div class="accordion-header" onclick="this.parentElement.classList.toggle('expanded')">
                            <div class="accordion-header-title">
                                <span class="accordion-icon">▼</span>
                                ${header}
                            </div>
                        </div>
                        <div class="accordion-content">
                            <div class="accordion-body">${formatContent(data[i])}</div>
                        </div>
                    `;
                    contentDiv.appendChild(item);
                }
            });

            updateFavButton();
        }

        function formatContent(text) {
            if (!text) return '';
            return text.split('\n').map(line => {
                if (line.startsWith('- ')) {
                    return `<li>${line.substring(2)}</li>`;
                }
                return line;
            }).join('\n').replace(/(<li>.*?<\/li>[\n]?)+/g, (match) => `<ul>${match}</ul>`);
        }

        // ===== FAVORITES =====
        function toggleFavorite() {
            if (!selectedPathology) return;

            const key = `${selectedUE}-${selectedPathology.name}`;
            const idx = favorites.indexOf(key);

            if (idx > -1) {
                favorites.splice(idx, 1);
            } else {
                favorites.push(key);
            }

            localStorage.setItem('ide_favorites', JSON.stringify(favorites));
            updateFavButton();
        }

        function updateFavButton() {
            const btn = document.getElementById('favBtn');
            if (!selectedPathology) return;

            const key = `${selectedUE}-${selectedPathology.name}`;
            if (favorites.includes(key)) {
                btn.classList.add('favorited');
            } else {
                btn.classList.remove('favorited');
            }
        }

        function toggleFavoritesOnly() {
            showFavoritesOnly = !showFavoritesOnly;
            document.getElementById('favoritesToggle').classList.toggle('active');
            // Filter logic to implement
        }

        // ===== HISTORY =====
        function addToHistory(name) {
            history = history.filter(h => h !== name);
            history.unshift(name);
            if (history.length > 10) history.pop();
            localStorage.setItem('ide_history', JSON.stringify(history));
            updateHistory();
        }

        function updateHistory() {
            const section = document.getElementById('historySection');
            if (history.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            const list = document.getElementById('historyList');
            list.innerHTML = history.map(h => `
                <div class="history-item" onclick="searchPathology('${h.replace(/'/g, "\\'")}')">${h}</div>
            `).join('');
        }

        function searchPathology(name) {
            const charts = allCharts.filter(c => c.ue === selectedUE);
            const chart = charts.find(c => c.name === name);
            if (chart) {
                selectPathology(chart, allCharts.indexOf(chart));
            }
        }

        // ===== COMPARISON =====
        function toggleComparisonMode() {
            comparisonMode = !comparisonMode;
            document.getElementById('comparisonToggle').classList.toggle('active');
            document.getElementById('comparisonMode').style.display = comparisonMode ? 'block' : 'none';
            document.getElementById('compareBtn').style.display = comparisonMode ? 'block' : 'none';
            selectedForComparison = [];
            updateComparisonUI();
        }

        function toggleComparisonSelect() {
            if (!selectedPathology) return;

            const key = `${selectedUE}-${selectedPathology.name}`;
            const idx = selectedForComparison.indexOf(key);

            if (idx > -1) {
                selectedForComparison.splice(idx, 1);
                document.getElementById('compareBtn').classList.remove('active');
            } else {
                selectedForComparison.push(key);
                document.getElementById('compareBtn').classList.add('active');
            }

            updateComparisonUI();
        }

        function updateComparisonUI() {
            const container = document.getElementById('selectedItems');
            container.innerHTML = selectedForComparison.map(item => {
                const [ue, name] = item.split(' - ');
                return `
                    <div class="selected-item">
                        ${name}
                        <span class="selected-item-remove" onclick="removeFromComparison('${item.replace(/'/g, "\\'")}')">&times;</span>
                    </div>
                `;
            }).join('');
        }

        function removeFromComparison(item) {
            selectedForComparison = selectedForComparison.filter(i => i !== item);
            updateComparisonUI();
        }

        // ===== FILTERING =====
        function filterPathologies() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            // Filter logic
        }

        function selectTab(category) {
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        // ===== EXPORT =====
        function exportAllToJSON() {
            const data = {
                ue: selectedUE,
                exportDate: new Date().toISOString(),
                pathologies: allCharts.filter(c => c.ue === selectedUE)
            };

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `IDE_${selectedUE}_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        function downloadPathology() {
            if (!selectedPathology) return;
            exportAllToJSON();
        }

        function exportComparison() {
            alert('Comparaison: ' + selectedForComparison.length + ' pathologies');
        }

        // ===== GO BACK =====
        function goBack() {
            selectedPathology = null;
            document.getElementById('pathologyView').style.display = 'none';
            document.getElementById('ueSelector').style.display = 'block';
            displayPortal();
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                SemesterSelector?.init?.(() => displayPortal());
            }, 100);
            loadAllCharts();
            updateHistory();
        });
    </script>
