<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déconnexion...</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .message {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <!-- Firebase Config -->
    <script src="/src/frontend/assets/scripts/config/firebase-config.js"></script>
    
    <!-- Cache Manager -->
    <script src="/src/frontend/assets/scripts/utils/cache-manager.js"></script>
    
    <!-- Auth Guard: Rediriger si non connecté -->
    <script src="/src/frontend/assets/scripts/auth/auth-guard.js"></script>
    <div class="message">
        <h1>Déconnexion en cours...</h1>
        <p id="status">Veuillez patienter...</p>
    </div>

    <script src="/src/frontend/assets/scripts/config/firebase-config.js"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getAuth, signOut } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';

        const app = initializeApp(window.firebaseConfig);
        const auth = getAuth(app);

        // Déconnexion immédiate
        signOut(auth).then(() => {
            // Effacer le cache des cours de la session
            if (typeof clearCoursesCache === 'function') {
                clearCoursesCache();
            } else {
                sessionStorage.removeItem('coursesData_session');
                console.log('🗑️ Cache des cours effacé');
            }
            
            document.getElementById('status').textContent = '✅ Déconnecté avec succès !';
            setTimeout(() => {
                window.location.href = '/src/frontend/pages/index.html';
            }, 1000);
        }).catch((error) => {
            document.getElementById('status').textContent = '❌ Erreur : ' + error.message;
        });
    </script>
</body>
</html>
