<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Révision en 15 questions par unité d'enseignement">
    <title>IFSI Lannion - Révision en 15 questions</title>
    <link rel="manifest" href="../../../public/manifest.json">
    <link rel="icon" type="image/png" href="../../../public/images/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="../assets/styles/theme.css">
    <link rel="stylesheet" href="../assets/styles/design-system.css">
    <link rel="stylesheet" href="../assets/styles/animations.css">
    <link rel="stylesheet" href="../assets/styles/layout.css">
    <style>
        html, body { min-height: 100%; }
        body { display: flex; flex-direction: column; background: var(--color-bg-light); }
        main { flex: 1; }
        .app-header { background: var(--color-bg); border-bottom: 1px solid var(--color-border); }
        .header-content { display: flex; align-items: center; max-width: 1280px; margin: auto; padding: var(--space-4); }
        .header-brand { display: flex; align-items: center; gap: var(--space-2); color: var(--color-text-dark); text-decoration: none; }
        .header-brand-icon { font-size: 1.5rem; }
        .header-brand-text h1, .header-brand-text p { margin: 0; }
        .header-brand-text h1 { color: var(--color-primary); font-size: var(--font-size-base); }
        .header-brand-text p { color: var(--color-text-muted); font-size: var(--font-size-xs); }
        .page-container { max-width: 960px; margin: auto; padding: var(--space-6) var(--space-4); width: 100%; }
        .hero { background: var(--gradient-primary); color: white; padding: var(--space-8) var(--space-4); text-align: center; }
        .hero h2 { color: white; margin: 0 0 var(--space-2); }
        .hero p { margin: 0; color: rgba(255,255,255,.9); }
        .ue-section { margin-top: var(--space-6); }
        .ue-title { color: var(--color-primary-dark); margin-bottom: var(--space-3); }
        .questionnaire-card, .question-card { background: var(--color-bg); border-radius: var(--radius-xl); padding: var(--space-5); box-shadow: var(--shadow-md); }
        .questionnaire-card { display: flex; justify-content: space-between; align-items: center; gap: var(--space-4); }
        .questionnaire-card h4, .questionnaire-card p { margin: 0; }
        .questionnaire-card p { color: var(--color-text-muted); margin-top: var(--space-1); }
        .button { border: 0; border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); background: var(--gradient-primary); color: white; font-weight: 700; cursor: pointer; }
        .button.secondary { background: var(--color-bg); border: 1px solid var(--color-primary); color: var(--color-primary); }
        .question-card { margin-top: var(--space-5); }
        .question-card h3 { margin-top: 0; }
        .question-number { color: var(--color-primary); font-weight: 700; }
        .answer { margin-top: var(--space-4); padding: var(--space-4); border-left: 4px solid var(--color-success); background: var(--color-bg-light); }
        .answer[hidden] { display: none; }
        .question-actions { display: flex; gap: var(--space-3); flex-wrap: wrap; margin-top: var(--space-4); }
        .status, .empty-state { color: var(--color-text-muted); text-align: center; padding: var(--space-6); }
        .error { color: var(--color-danger); }
        .hidden { display: none !important; }
        .app-footer { text-align: center; color: var(--color-text-muted); padding: var(--space-6); font-size: var(--font-size-xs); }
        @media (max-width: 640px) {
            .questionnaire-card { align-items: stretch; flex-direction: column; }
            .questionnaire-card .button { width: 100%; }
        }
        @media (min-width: 641px) { .header-content, .page-container { padding-left: var(--space-6); padding-right: var(--space-6); } }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <a href="./home.html" class="header-brand">
                <span class="header-brand-icon">📚</span>
                <div class="header-brand-text"><h1>IFSI Lannion</h1><p>Promo 2025-2028</p></div>
            </a>
        </div>
    </header>
    <main>
        <section class="hero">
            <h2>🧠 Révision en 15 questions</h2>
            <p>Choisissez une unité d’enseignement, puis révélez les réponses une par une à votre rythme.</p>
        </section>
        <div class="page-container">
            <div id="questionnaireList" aria-live="polite">
                <p class="status">Chargement des questionnaires…</p>
            </div>
            <section id="questionnaireView" class="hidden" aria-live="polite"></section>
        </div>
    </main>
    <footer class="app-footer">IFSI Lannion 2025 - Plateforme v3.0</footer>
    <script src="../assets/scripts/modules/questionnaires.js"></script>
</body>
</html>
