<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiches médicaments - IFSI Révision</title>
    <link rel="stylesheet" href="../assets/styles/theme.css">
    <link rel="stylesheet" href="../assets/styles/design-system.css">
    <style>
        body { background: var(--color-bg-light); color: var(--color-text-dark); }
        .shell { max-width:1100px; margin:auto; padding:1rem; }
        header { display:flex; justify-content:space-between; margin-bottom:1.5rem; }
        a { color:var(--color-primary); }
        .panel, .medication { background:#fff; border:1px solid var(--color-border); border-radius:1rem; padding:1.2rem; margin-bottom:1rem; }
        form { display:flex; gap:.75rem; } input { flex:1; padding:.8rem; border:1px solid var(--color-border); border-radius:.5rem; font:inherit; }
        .medication h2 { margin-top:0; } .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; }
        .label { font-size:.8rem; color:var(--color-text-muted); text-transform:uppercase; letter-spacing:.04em; }
        ul { padding-left:1.2rem; } .status { min-height:1.5rem; color:var(--color-text-muted); }
        @media(max-width:600px){form{flex-direction:column;} header{gap:1rem; flex-direction:column;}}
    </style>
</head>
<body>
<main class="shell">
    <header><strong>💊 Fiches médicaments</strong><a href="./ressources.html">← Ressources</a></header>
    <section class="panel">
        <h1>Fiches médicaments</h1>
        <p>Les éléments pédagogiques proviennent des données locales de l’application. Les liens officiels permettent de vérifier la notice et le RCP.</p>
        <form id="medicationForm"><input id="medicationInput" placeholder="Ex. morphine, paracétamol, antibiotique" aria-label="Rechercher un médicament"><button class="btn btn-primary">Rechercher</button></form>
        <div id="medicationStatus" class="status"></div>
    </section>
    <section id="medicationResults" aria-live="polite"></section>
</main>
<script src="../assets/scripts/integrations/medications.js"></script>
</body>
</html>
