<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Parser CSV - Quiz Pharmacologie</title>
    <style>
        body { font-family: Arial; padding: 2rem; max-width: 900px; margin: 0 auto; }
        .box { background: #f5f5f5; padding: 1rem; margin: 1rem 0; border-radius: 8px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        h2 { color: #333; border-bottom: 2px solid #667eea; padding-bottom: 0.5rem; }
        pre { background: #333; color: #0f0; padding: 1rem; overflow-x: auto; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🧪 Test Parser CSV</h1>
    <div id="results"></div>

    <script>
        if (!window.resolvePath) {
            const isGitHubPages = window.location.hostname.includes('github.io');
            const basePath = isGitHubPages ? '/ifsi-revision' : '';
            window.resolvePath = (path) => path.startsWith('/') ? basePath + path : path;
        }
    </script>
    <script src="../assets/scripts/modules/pharma-quiz.js"></script>
    <script>
        async function test() {
            const results = document.getElementById('results');
            
            try {
                // Test 1: Créer instance
                results.innerHTML += '<div class="box success"><h2>✓ Test 1: Création instance</h2><p>Instance PharmaQuiz créée</p></div>';
                const quiz = new PharmaQuiz();
                
                // Test 2: Charger données
                results.innerHTML += '<div class="box"><h2>Test 2: Chargement CSV...</h2><p id="loading">En cours...</p></div>';
                const loaded = await quiz.loadPharmaData();
                
                if (loaded && quiz.pharmaData.length > 0) {
                    results.innerHTML = results.innerHTML.replace(
                        '<p id="loading">En cours...</p>',
                        `<p class="success" style="margin: 0; padding: 0.5rem; background: #d4edda; border-radius: 4px;">
                            ✓ ${quiz.pharmaData.length} entrées chargées (attendu: ~52)
                        </p>`
                    );
                    
                    // Test 3: Générer quiz avec 30 questions
                    quiz.generateQuiz(30, 'mixed');
                    const questionsGenerated = quiz.currentQuiz.length;
                    
                    const backgroundColor = questionsGenerated === 30 ? '#d4edda' : '#fff3cd';
                    const color = questionsGenerated === 30 ? '#155724' : '#856404';
                    
                    results.innerHTML += `<div class="box" style="background: ${backgroundColor}; color: ${color};">
                        <h2>Test 3: Génération ${questionsGenerated} questions (demandé: 30)</h2>
                        <p>${questionsGenerated === 30 ? '✓ SUCCÈS' : '⚠ À vérifier'}: ${questionsGenerated} questions générées</p>
                        ${questionsGenerated > 0 ? `<p><strong>Première question:</strong><br>${quiz.currentQuiz[0].question}</p>` : ''}
                    </div>`;
                    
                    // Première question
                    results.innerHTML += `<div class="box">
                        <h2>✓ Exemple de données</h2>
                        <pre>${JSON.stringify(quiz.pharmaData[0], null, 2)}</pre>
                    </div>`;
                    
                } else {
                    results.innerHTML += '<div class="box error"><h2>✗ Erreur</h2><p>Aucune donnée chargée</p></div>';
                }
                
            } catch (error) {
                results.innerHTML += `<div class="box error"><h2>✗ Erreur</h2><pre>${error.message}\n${error.stack}</pre></div>`;
            }
        }

        window.addEventListener('DOMContentLoaded', test);
    </script>
</body>
</html>
