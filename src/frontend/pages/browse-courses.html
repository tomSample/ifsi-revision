<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Parcourir les cours - IFSI Lannion 2025">
    <meta name="theme-color" content="#2563EB">
    
    <title>Parcourir les Cours - IFSI Lannion 2025</title>
    
    <!-- Manifest & Icons -->
    <link rel="manifest" href="../../../public/manifest.json">
    <link rel="icon" type="image/x-icon" href="../../../public/favicon.ico">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Design System CSS -->
    <link rel="stylesheet" href="../assets/styles/theme.css">
    <link rel="stylesheet" href="../assets/styles/design-system.css">
    <link rel="stylesheet" href="../assets/styles/animations.css">
    <link rel="stylesheet" href="../assets/styles/layout.css">
    
    <!-- Page-specific styles -->
    <style>
        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            background: var(--color-bg-light);
        }

        main {
            flex: 1;
        }

        /* ===== HEADER ===== */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--color-bg);
            border-bottom: 1px solid var(--color-border);
            box-shadow: var(--shadow-xs);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-4);
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            text-decoration: none;
            color: var(--color-text-dark);
        }

        .header-brand-icon {
            font-size: 1.5rem;
        }

        .header-brand-text h1 {
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-bold);
            margin: 0;
            color: var(--color-primary);
        }

        .header-brand-text p {
            font-size: 0.65rem;
            color: var(--color-text-muted);
            margin: var(--space-1) 0 0 0;
        }

        .header-link {
            font-size: var(--font-size-base);
            color: var(--color-primary);
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        .header-link:hover {
            color: var(--color-primary-dark);
        }

        @media (min-width: 641px) {
            .header-content {
                padding: var(--space-6);
            }

            .header-brand-text h1 {
                font-size: var(--font-size-lg);
            }
        }

        /* ===== PAGE CONTAINER ===== */
        .page-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: var(--space-4);
            width: 100%;
        }

        @media (min-width: 641px) {
            .page-container {
                padding: var(--space-8) var(--space-6);
            }
        }

        .page-title {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-dark);
            margin-bottom: var(--space-6);
            animation: slideInUp var(--transition-base);
        }

        /* ===== FILTERS ===== */
        .filters-section {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--space-4);
            margin-bottom: var(--space-8);
            padding: var(--space-4);
            background: var(--color-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
        }

        @media (min-width: 641px) {
            .filters-section {
                grid-template-columns: repeat(2, 1fr);
                gap: var(--space-6);
            }
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .filter-label {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-dark);
        }

        .filter-select {
            padding: var(--space-2) var(--space-3);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            background: var(--color-bg-light);
            color: var(--color-text-dark);
            font-family: inherit;
            font-size: var(--font-size-sm);
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* ===== COURSES GRID ===== */
        .courses-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--space-4);
        }

        @media (min-width: 641px) {
            .courses-grid {
                gap: var(--space-6);
            }
        }

        .course-card {
            background: var(--color-bg);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: all var(--transition-base);
            display: flex;
            flex-direction: column;
            animation: slideInUp var(--transition-base) both;
        }

        .course-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .course-header {
            padding: var(--space-4);
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            color: white;
        }

        .course-ue {
            font-size: var(--font-size-xs);
            opacity: 0.9;
            margin-bottom: var(--space-1);
            text-transform: uppercase;
            letter-spacing: var(--letter-spacing-wide);
        }

        .course-title {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-bold);
            margin: 0;
            color: white;
        }

        .course-body {
            padding: var(--space-4);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .term-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .term-item {
            padding: var(--space-3);
            border-bottom: 1px solid var(--color-border);
            transition: background var(--transition-fast);
        }

        .term-item:last-child {
            border-bottom: none;
        }

        .term-item.highlighted {
            background: var(--color-primary-lighter);
        }

        .term-item:hover {
            background: var(--color-bg-lighter);
        }

        .term-item-title {
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-dark);
            font-size: var(--font-size-sm);
            margin-bottom: var(--space-1);
        }

        .term-item-def {
            font-size: var(--font-size-xs);
            color: var(--color-text-muted);
            line-height: var(--line-height-relaxed);
        }

        .course-footer {
            padding: var(--space-3) var(--space-4);
            background: var(--color-bg-lighter);
            border-top: 1px solid var(--color-border);
            font-size: var(--font-size-xs);
            color: var(--color-text-muted);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: var(--space-12) var(--space-4);
            color: var(--color-text-muted);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: var(--space-4);
        }

        .empty-state h3 {
            color: var(--color-text-dark);
            margin-bottom: var(--space-2);
        }

        /* ===== FOOTER ===== */
        .app-footer {
            background: var(--color-bg-lighter);
            border-top: 1px solid var(--color-border);
            padding: var(--space-6) var(--space-4);
            text-align: center;
            color: var(--color-text-muted);
            font-size: var(--font-size-xs);
            margin-top: var(--space-12);
        }
    </style>
</head>
<body>
    <!-- ===== HEADER ===== -->
    <header class="app-header">
        <div class="header-content">
            <a href="./home.html" class="header-brand">
                <span class="header-brand-icon">📚</span>
                <div class="header-brand-text">
                    <h1>IFSI Lannion</h1>
                    <p>Révisions 2025</p>
                </div>
            </a>
            <a href="./home.html" class="header-link">← Retour</a>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main>
        <div class="page-container">
            <h1 class="page-title">📖 Parcourir les Cours</h1>

            <!-- FILTERS -->
            <div class="filters-section">
                <div class="filter-group">
                    <label for="filterUE" class="filter-label">Filtrer par UE</label>
                    <select id="filterUE" class="filter-select">
                        <option value="">Toutes les UE</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterSemester" class="filter-label">Filtrer par Semestre</label>
                    <select id="filterSemester" class="filter-select">
                        <option value="">Tous les Semestres</option>
                    </select>
                </div>
            </div>

            <!-- COURSES GRID -->
            <div id="coursesContainer" class="courses-grid">
                <div class="empty-state">
                    <div class="empty-state-icon">📚</div>
                    <h3>Chargement des cours...</h3>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="app-footer">
        <p>IFSI Lannion 2025 - Plateforme v3.0</p>
    </footer>

    <!-- ===== SCRIPTS ===== -->
    <script>
        let allCourses = [];
        let filteredCourses = [];
        let highlightedTerm = null;
        let highlightedUE = null;

        // Get URL parameters
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                term: params.get('term'),
                ue: params.get('ue')
            };
        }

        // Load courses
        async function loadCourses() {
            try {
                const response = await fetch('/src/data/courses.json');
                const data = await response.json();
                allCourses = data.courses || [];
                
                const urlParams = getUrlParams();
                highlightedTerm = urlParams.term;
                highlightedUE = urlParams.ue;
                
                populateFilters();
                renderCourses(allCourses);
                
                // Auto-scroll to highlighted term if present
                if (highlightedTerm) {
                    setTimeout(() => {
                        const element = document.querySelector('.term-item.highlighted');
                        if (element) {
                            element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 300);
                }
            } catch (error) {
                console.error('Could not load courses:', error);
                document.getElementById('coursesContainer').innerHTML = 
                    '<div class="empty-state"><div class="empty-state-icon">❌</div><h3>Erreur de chargement</h3></div>';
            }
        }

        // Populate filter dropdowns
        function populateFilters() {
            const ueSet = new Set();
            const semesterSet = new Set();

            allCourses.forEach(([, course]) => {
                ueSet.add(course.ue);
                const semester = course.ue.split('.')[2]; // e.g., "S1" from "2.2.S1"
                semesterSet.add(semester);
            });

            // Sort UEs
            const ueArray = Array.from(ueSet).sort((a, b) => {
                const aParts = a.split('.');
                const bParts = b.split('.');
                const aNum = parseInt(aParts[0]) * 100 + parseInt(aParts[1]);
                const bNum = parseInt(bParts[0]) * 100 + parseInt(bParts[1]);
                return aNum - bNum;
            });

            const ueSelect = document.getElementById('filterUE');
            ueArray.forEach(ue => {
                const option = document.createElement('option');
                option.value = ue;
                option.textContent = `UE ${ue}`;
                ueSelect.appendChild(option);
            });

            // Sort Semesters
            const semesterArray = Array.from(semesterSet).sort((a, b) => {
                const aNum = parseInt(a.replace('S', ''));
                const bNum = parseInt(b.replace('S', ''));
                return aNum - bNum;
            });

            const semesterSelect = document.getElementById('filterSemester');
            semesterArray.forEach(semester => {
                const option = document.createElement('option');
                option.value = semester;
                option.textContent = semester;
                semesterSelect.appendChild(option);
            });

            // Set initial values if URL params exist
            if (highlightedUE) {
                ueSelect.value = highlightedUE;
            }
        }

        // Filter courses
        function applyFilters() {
            const ueFilter = document.getElementById('filterUE').value;
            const semesterFilter = document.getElementById('filterSemester').value;

            filteredCourses = allCourses.filter(([, course]) => {
                const ueMatch = !ueFilter || course.ue === ueFilter;
                const semesterMatch = !semesterFilter || course.ue.includes(semesterFilter);
                return ueMatch && semesterMatch;
            });

            renderCourses(filteredCourses);
        }

        // Render courses
        function renderCourses(courses) {
            const container = document.getElementById('coursesContainer');

            if (courses.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">🔍</div>
                        <h3>Aucun cours trouvé</h3>
                        <p>Essayez de modifier vos filtres</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = courses.map(([, course], index) => {
                const definitions = course.definitions || [];
                const termsHtml = definitions.map((def, defIndex) => {
                    const isHighlighted = highlightedTerm && def.term === highlightedTerm;
                    return `
                        <li class="term-item ${isHighlighted ? 'highlighted' : ''}" ${isHighlighted ? 'id="highlighted-term"' : ''}>
                            <div class="term-item-title">${escapeHtml(def.term)}</div>
                            <div class="term-item-def">${escapeHtml(def.definition)}</div>
                        </li>
                    `;
                }).join('');

                return `
                    <div class="course-card" style="animation-delay: ${index * 50}ms">
                        <div class="course-header">
                            <div class="course-ue">${escapeHtml(course.ue)}</div>
                            <h2 class="course-title">${escapeHtml(course.title)}</h2>
                        </div>
                        <div class="course-body">
                            <ul class="term-list">
                                ${termsHtml}
                            </ul>
                        </div>
                        <div class="course-footer">
                            ${definitions.length} terme${definitions.length > 1 ? 's' : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Escape HTML
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Event listeners
        document.getElementById('filterUE').addEventListener('change', applyFilters);
        document.getElementById('filterSemester').addEventListener('change', applyFilters);

        // Load on page load
        window.addEventListener('load', loadCourses);
    </script>
</body>
</html>
