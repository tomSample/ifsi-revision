<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Parcourir les cours - IFSI Lannion 2025">
    <meta name="theme-color" content="#2563EB">
    
    <title>Parcourir les Cours - IFSI Lannion 2025</title>
    
    <!-- Manifest & Icons -->
    <link rel="manifest" href="../../../public/manifest.json">
    <link rel="icon" type="image/x-icon" href="../../../public/favicon.ico">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Design System CSS -->
    <link rel="stylesheet" href="../assets/styles/theme.css">
    <link rel="stylesheet" href="../assets/styles/design-system.css">
    <link rel="stylesheet" href="../assets/styles/animations.css">
    <link rel="stylesheet" href="../assets/styles/layout.css">
    
    <!-- Page-specific styles -->
    <style>
        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            background: var(--color-bg-light);
        }

        main {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        /* ===== HEADER ===== */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--color-bg);
            border-bottom: 1px solid var(--color-border);
            box-shadow: var(--shadow-xs);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-4);
            max-width: 100%;
            width: 100%;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            text-decoration: none;
            color: var(--color-text-dark);
        }

        .header-brand-icon {
            font-size: 1.5rem;
        }

        .header-brand-text h1 {
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-bold);
            margin: 0;
            color: var(--color-primary);
        }

        .header-brand-text p {
            font-size: 0.65rem;
            color: var(--color-text-muted);
            margin: var(--space-1) 0 0 0;
        }

        .header-link {
            font-size: var(--font-size-base);
            color: var(--color-primary);
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        .header-link:hover {
            color: var(--color-primary-dark);
        }

        @media (min-width: 641px) {
            .header-content {
                padding: var(--space-6);
            }

            .header-brand-text h1 {
                font-size: var(--font-size-lg);
            }
        }

        /* ===== SIDEBAR (DESKTOP) ===== */
        .sidebar {
            display: none;
            flex-direction: column;
            gap: var(--space-6);
            padding: var(--space-6);
            background: var(--color-bg);
            border-right: 1px solid var(--color-border);
            min-width: 280px;
            max-width: 280px;
            overflow-y: auto;
        }

        @media (min-width: 1025px) {
            .sidebar {
                display: flex;
            }
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .filter-label {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-dark);
        }

        .filter-select {
            padding: var(--space-2) var(--space-3);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            background: var(--color-bg-light);
            color: var(--color-text-dark);
            font-family: inherit;
            font-size: var(--font-size-sm);
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .ue-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .ue-item {
            padding: var(--space-2) var(--space-3);
            border-radius: var(--radius-lg);
            cursor: pointer;
            background: var(--color-bg-light);
            transition: all var(--transition-base);
            border: 2px solid transparent;
        }

        .ue-item:hover {
            background: var(--color-bg-lighter);
        }

        .ue-item.active {
            background: var(--color-primary-lighter);
            border-color: var(--color-primary);
            color: var(--color-primary-dark);
            font-weight: var(--font-weight-semibold);
        }

        .ue-item-text {
            font-size: var(--font-size-xs);
        }

        /* ===== MOBILE FILTERS ===== */
        .mobile-filters {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-3);
            padding: var(--space-4);
            background: var(--color-bg);
            border-bottom: 1px solid var(--color-border);
        }

        @media (min-width: 1025px) {
            .mobile-filters {
                display: none;
            }
        }

        /* ===== CONTENT AREA ===== */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .page-container {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-4);
        }

        @media (min-width: 641px) {
            .page-container {
                padding: var(--space-6);
            }
        }

        .page-title {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-dark);
            margin-bottom: var(--space-6);
            animation: slideInUp var(--transition-base);
        }

        /* ===== ACCORDIONS/COURSES ===== */
        .courses-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }

        .accordion {
            background: var(--color-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
            overflow: hidden;
            animation: slideInUp var(--transition-base) both;
        }

        .accordion:nth-child(1) { animation-delay: 0ms; }
        .accordion:nth-child(2) { animation-delay: 50ms; }
        .accordion:nth-child(3) { animation-delay: 100ms; }
        .accordion:nth-child(4) { animation-delay: 150ms; }
        .accordion:nth-child(n+5) { animation-delay: 200ms; }

        .accordion-header {
            padding: var(--space-4);
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            color: white;
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .accordion-header:hover {
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .accordion-title {
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .accordion-ue {
            font-size: var(--font-size-xs);
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: var(--letter-spacing-wide);
        }

        .accordion-course {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-bold);
            margin: 0;
        }

        .accordion-toggle {
            font-size: var(--font-size-xl);
            transition: transform var(--transition-base);
        }

        .accordion.open .accordion-toggle {
            transform: rotate(180deg);
        }

        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height var(--transition-base);
        }

        .accordion.open .accordion-body {
            max-height: 2000px;
        }

        .term-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .term-item {
            padding: var(--space-4);
            border-bottom: 1px solid var(--color-border);
            transition: background var(--transition-fast);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: var(--space-3);
        }

        .term-item:last-child {
            border-bottom: none;
        }

        .term-item.highlighted {
            background: var(--color-primary-lighter);
        }

        .term-item:hover {
            background: var(--color-bg-lighter);
        }

        .term-content {
            flex: 1;
            min-width: 0;
        }

        .term-item-title {
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-dark);
            font-size: var(--font-size-sm);
            margin-bottom: var(--space-1);
        }

        .term-item-def {
            font-size: var(--font-size-xs);
            color: var(--color-text-muted);
            line-height: var(--line-height-relaxed);
        }

        .term-rating {
            display: flex;
            gap: var(--space-1);
            flex-shrink: 0;
        }

        .rating-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            cursor: pointer;
            font-size: var(--font-size-xs);
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rating-btn:hover {
            background: var(--color-primary-lighter);
            border-color: var(--color-primary);
        }

        .rating-btn.active {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: var(--space-12) var(--space-4);
            color: var(--color-text-muted);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: var(--space-4);
        }

        .empty-state h3 {
            color: var(--color-text-dark);
            margin-bottom: var(--space-2);
        }

        /* ===== FOOTER ===== */
        .app-footer {
            background: var(--color-bg-lighter);
            border-top: 1px solid var(--color-border);
            padding: var(--space-6) var(--space-4);
            text-align: center;
            color: var(--color-text-muted);
            font-size: var(--font-size-xs);
        }
    </style>
</head>
<body>
    <!-- ===== HEADER ===== -->
    <header class="app-header">
        <div class="header-content">
            <a href="./home.html" class="header-brand">
                <span class="header-brand-icon">📚</span>
                <div class="header-brand-text">
                    <h1>IFSI Lannion</h1>
                    <p>Révisions 2025</p>
                </div>
            </a>
            <a href="./home.html" class="header-link">← Retour</a>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main>
        <!-- SIDEBAR (DESKTOP) -->
        <aside class="sidebar">
            <div class="filter-group">
                <label for="desktopSemester" class="filter-label">Semestre</label>
                <select id="desktopSemester" class="filter-select">
                    <option value="">Tous les semestres</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Cours</label>
                <ul class="ue-list" id="desktopUEList"></ul>
            </div>
        </aside>

        <!-- CONTENT AREA -->
        <div class="content-area">
            <!-- MOBILE FILTERS -->
            <div class="mobile-filters">
                <div class="filter-group">
                    <label for="mobileSemester" class="filter-label">Semestre</label>
                    <select id="mobileSemester" class="filter-select">
                        <option value="">Tous</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="mobileUE" class="filter-label">UE</label>
                    <select id="mobileUE" class="filter-select">
                        <option value="">Toutes les UE</option>
                    </select>
                </div>
            </div>

            <!-- PAGE CONTENT -->
            <div class="page-container">
                <h1 class="page-title">📖 Parcourir les Cours</h1>
                <div id="coursesContainer" class="courses-list">
                    <div class="empty-state">
                        <div class="empty-state-icon">📚</div>
                        <h3>Chargement des cours...</h3>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="app-footer">
        <p>IFSI Lannion 2025 - Plateforme v3.0</p>
    </footer>

    <!-- ===== SCRIPTS ===== -->
    <script>
        let allCourses = [];
        let filteredCourses = [];
        let highlightedTerm = null;
        let highlightedUE = null;
        let currentFilters = {
            semester: '',
            ue: ''
        };

        // Get URL parameters
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                term: params.get('term'),
                ue: params.get('ue')
            };
        }

        // Load term ratings from localStorage
        function getTermRating(termKey) {
            const ratings = JSON.parse(localStorage.getItem('termRatings') || '{}');
            return ratings[termKey] || null;
        }

        function setTermRating(termKey, rating) {
            const ratings = JSON.parse(localStorage.getItem('termRatings') || '{}');
            if (rating === null) {
                delete ratings[termKey];
            } else {
                ratings[termKey] = rating;
            }
            localStorage.setItem('termRatings', JSON.stringify(ratings));
        }

        // Load courses
        async function loadCourses() {
            try {
                const response = await fetch('/src/data/courses.json');
                const data = await response.json();
                allCourses = data.courses || [];
                
                const urlParams = getUrlParams();
                highlightedTerm = urlParams.term;
                highlightedUE = urlParams.ue;
                
                populateFilters();
                applyFilters();
                
                // Auto-scroll to highlighted term if present
                if (highlightedTerm) {
                    setTimeout(() => {
                        const element = document.querySelector('.term-item.highlighted');
                        if (element) {
                            element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 300);
                }
            } catch (error) {
                console.error('Could not load courses:', error);
                document.getElementById('coursesContainer').innerHTML = 
                    '<div class="empty-state"><div class="empty-state-icon">❌</div><h3>Erreur de chargement</h3></div>';
            }
        }

        // Populate filter dropdowns
        function populateFilters() {
            const semesters = new Set();
            const uesByUE = {};

            allCourses.forEach(([, course]) => {
                const semester = course.ue.split('.')[2];
                semesters.add(semester);
                
                if (!uesByUE[course.ue]) {
                    uesByUE[course.ue] = course.title;
                }
            });

            // Sort semesters
            const semesterArray = Array.from(semesters).sort((a, b) => {
                const aNum = parseInt(a.replace('S', ''));
                const bNum = parseInt(b.replace('S', ''));
                return aNum - bNum;
            });

            [document.getElementById('desktopSemester'), document.getElementById('mobileSemester')].forEach(select => {
                if (select) {
                    semesterArray.forEach(sem => {
                        const option = document.createElement('option');
                        option.value = sem;
                        option.textContent = sem;
                        select.appendChild(option);
                    });
                    select.addEventListener('change', applyFilters);
                }
            });

            // Sort UEs
            const ueArray = Object.keys(uesByUE).sort((a, b) => {
                const aParts = a.split('.');
                const bParts = b.split('.');
                const aNum = parseInt(aParts[0]) * 100 + parseInt(aParts[1]);
                const bNum = parseInt(bParts[0]) * 100 + parseInt(bParts[1]);
                return aNum - bNum;
            });

            // Populate desktop sidebar
            const desktopUEList = document.getElementById('desktopUEList');
            ueArray.forEach(ue => {
                const li = document.createElement('li');
                li.className = 'ue-item' + (highlightedUE === ue ? ' active' : '');
                li.innerHTML = `<span class="ue-item-text"><strong>${ue}</strong><br/>${escapeHtml(uesByUE[ue])}</span>`;
                li.onclick = () => selectUE(ue);
                desktopUEList.appendChild(li);
            });

            // Populate mobile UE select
            const mobileUE = document.getElementById('mobileUE');
            if (mobileUE) {
                ueArray.forEach(ue => {
                    const option = document.createElement('option');
                    option.value = ue;
                    option.textContent = `${ue} - ${uesByUE[ue]}`;
                    mobileUE.appendChild(option);
                });
                mobileUE.addEventListener('change', applyFilters);
            }
        }

        // Select UE from sidebar
        function selectUE(ue) {
            currentFilters.ue = (currentFilters.ue === ue) ? '' : ue;
            applyFilters();
            
            // Update UI
            document.querySelectorAll('.ue-item').forEach(item => item.classList.remove('active'));
            document.querySelectorAll('.ue-item').forEach(item => {
                if (item.textContent.includes(ue)) {
                    item.classList.add('active');
                }
            });
        }

        // Apply filters
        function applyFilters() {
            const desktopSem = document.getElementById('desktopSemester')?.value || '';
            const mobileSem = document.getElementById('mobileSemester')?.value || '';
            const mobileUE = document.getElementById('mobileUE')?.value || '';
            
            currentFilters.semester = desktopSem || mobileSem;
            currentFilters.ue = mobileUE || currentFilters.ue;

            filteredCourses = allCourses.filter(([, course]) => {
                const semMatch = !currentFilters.semester || course.ue.includes(currentFilters.semester);
                const ueMatch = !currentFilters.ue || course.ue === currentFilters.ue;
                return semMatch && ueMatch;
            });

            renderCourses(filteredCourses);
        }

        // Render courses as accordions
        function renderCourses(courses) {
            const container = document.getElementById('coursesContainer');

            if (courses.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <h3>Aucun cours trouvé</h3>
                        <p>Essayez de modifier vos filtres</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = courses.map(([, course], index) => {
                const definitions = course.definitions || [];
                const termsHtml = definitions.map((def, defIndex) => {
                    const termKey = `${course.ue}|${def.term}`;
                    const rating = getTermRating(termKey);
                    const isHighlighted = highlightedTerm && def.term === highlightedTerm;
                    
                    return `
                        <li class="term-item ${isHighlighted ? 'highlighted' : ''}" ${isHighlighted ? 'id="highlighted-term"' : ''}>
                            <div class="term-content">
                                <div class="term-item-title">${escapeHtml(def.term)}</div>
                                <div class="term-item-def">${escapeHtml(def.definition)}</div>
                            </div>
                            <div class="term-rating">
                                <button class="rating-btn ${rating === 'T' ? 'active' : ''}" onclick="rateTermAdmin('${course.ue}', '${def.term}', 'T')" title="Ciblé">🎯</button>
                                <button class="rating-btn ${rating === 'E' ? 'active' : ''}" onclick="rateTermAdmin('${course.ue}', '${def.term}', 'E')" title="Élargi">📖</button>
                                <button class="rating-btn ${rating === 'C' ? 'active' : ''}" onclick="rateTermAdmin('${course.ue}', '${def.term}', 'C')" title="Complet">✓</button>
                            </div>
                        </li>
                    `;
                }).join('');

                return `
                    <div class="accordion" style="animation-delay: ${index * 50}ms">
                        <div class="accordion-header" onclick="toggleAccordion(this)">
                            <div class="accordion-title">
                                <div class="accordion-ue">${escapeHtml(course.ue)}</div>
                                <h2 class="accordion-course">${escapeHtml(course.title)}</h2>
                            </div>
                            <div class="accordion-toggle">▼</div>
                        </div>
                        <div class="accordion-body">
                            <ul class="term-list">
                                ${termsHtml}
                            </ul>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Toggle accordion
        function toggleAccordion(header) {
            const accordion = header.parentElement;
            accordion.classList.toggle('open');
        }

        // Rate term (admin only)
        function rateTermAdmin(ue, term, rating) {
            const termKey = `${ue}|${term}`;
            const currentRating = getTermRating(termKey);
            
            if (currentRating === rating) {
                setTermRating(termKey, null);
            } else {
                setTermRating(termKey, rating);
            }
            
            applyFilters();
        }

        // Escape HTML
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Load on page load
        window.addEventListener('load', loadCourses);
    </script>
</body>
</html>
